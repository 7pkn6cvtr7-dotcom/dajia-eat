<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>大甲吃什麼｜店家後台</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f7f7;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}
header{background:#f87542;color:#fff;padding:22px 18px}header h1{font-size:24px;margin:0}header p{margin:7px 0 0}
.wrap{max-width:760px;margin:auto;padding:18px}.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 3px 12px #0000000a}
h2{font-size:20px;margin:0 0 14px}label{display:block;margin:12px 0 5px;font-weight:600}
input,textarea{width:100%;border:1px solid #ddd;border-radius:10px;padding:12px;font:inherit}textarea{min-height:70px}
button{border:0;background:#f87542;color:#fff;border-radius:10px;padding:10px 14px;font:inherit;font-weight:600;cursor:pointer}button:disabled{opacity:.55}
.quiet{background:#eee;color:#333}.danger{background:#aa3535}.success{background:#2f7d45}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tabs{display:flex;gap:8px;margin-bottom:14px;overflow:auto}.tabs button{flex:1;white-space:nowrap}.tabs .inactive{background:#fff;color:#444}
.muted{color:#666;font-size:14px;line-height:1.5}.line{border-top:1px solid #eee;padding:15px 0}.line:first-child{border:0;padding-top:0}
.badge{border-radius:20px;padding:5px 10px;background:#fff0e7;color:#b94e20;font-size:13px;white-space:nowrap}
.badge.accepted{background:#e3f5e5;color:#247433}.badge.preparing{background:#fff3cd;color:#856404}.badge.ready{background:#d9edf7;color:#17627a}
.badge.completed{background:#e9ecef;color:#495057}.badge.rejected{background:#fbe6e6;color:#a32b2b}
.error{color:#ae3030}.hidden{display:none!important}#notice{min-height:22px}
</style></head><body>
<header><h1>大甲吃什麼｜店家後台</h1><p id="storeLabel">店家登入後即可接單與管理商品</p></header>
<main class="wrap">
<section class="card" id="loginPanel"><h2>店家登入</h2><form id="loginForm">
<label>電子郵件</label><input id="email" type="email" required><label>密碼</label><input id="password" type="password" required>
<div class="actions"><button>登入</button></div></form></section>
<div id="appPanel" class="hidden">
<div class="row card"><strong id="staffInfo"></strong><button class="quiet" id="logout">登出</button></div>
<div class="tabs"><button id="ordersTab">進行中</button><button id="historyTab" class="inactive">歷史訂單</button><button id="productsTab" class="inactive">商品管理</button></div>
<section id="ordersPanel"><div class="card"><h2>即時訂單</h2><p class="muted">只顯示尚未結束的訂單。</p><div id="ordersList">讀取中...</div></div></section>
<section id="historyPanel" class="hidden"><div class="card"><h2>歷史訂單</h2><p class="muted">只顯示此店家的已完成或無法接單紀錄。</p><div id="historyList">讀取中...</div></div></section>
<section id="productsPanel" class="hidden">
<div class="card"><h2 id="formTitle">新增商品</h2><form id="productForm"><label>品名</label><input id="productName" maxlength="60" required>
<label>售價（元）</label><input id="productPrice" type="number" min="1" max="9999" step="1" required>
<label>說明（選填）</label><textarea id="productDescription" maxlength="200"></textarea>
<div class="actions"><button id="saveProduct">儲存商品</button><button type="button" id="cancelEdit" class="quiet hidden">取消編輯</button></div></form></div>
<div class="card"><h2>商品清單</h2><div id="productsList">讀取中...</div></div></section>
</div><p id="notice"></p></main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";
import {getFirestore,collection,doc,getDoc,addDoc,updateDoc,query,where,onSnapshot,serverTimestamp} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";
const config={apiKey:"AIzaSyBGJmQtrcZzLGPa783ZEAAI9FL5asa5J8A",authDomain:"dajia-eat.firebaseapp.com",projectId:"dajia-eat",storageBucket:"dajia-eat.firebasestorage.app",messagingSenderId:"213698880065",appId:"1:213698880065:web:cb3611a26082e618615cc0"};
const app=initializeApp(config),auth=getAuth(app),db=getFirestore(app),el=id=>document.getElementById(id);
let storeId=null,editingId=null,stopOrders=null,stopProducts=null;
const statusText={new:"待接單",accepted:"已接單",preparing:"製作中",ready:"可取餐／等待外送",completed:"已完成",rejected:"無法接單"};
function notice(m,e=false){el("notice").textContent=m;el("notice").className=e?"error":""}
function clean(){stopOrders?.();stopProducts?.();stopOrders=stopProducts=null;storeId=null;editingId=null;el("appPanel").classList.add("hidden");el("loginPanel").classList.remove("hidden")}
function tab(which){for(const n of ["orders","history","products"]){el(n+"Panel").classList.toggle("hidden",n!==which);el(n+"Tab").classList.toggle("inactive",n!==which)}}
el("ordersTab").onclick=()=>tab("orders");el("historyTab").onclick=()=>tab("history");el("productsTab").onclick=()=>tab("products");el("logout").onclick=()=>signOut(auth);
el("loginForm").onsubmit=async e=>{e.preventDefault();try{await signInWithEmailAndPassword(auth,el("email").value.trim(),el("password").value)}catch(x){notice("登入失敗，請確認帳號與密碼。",true)}};
onAuthStateChanged(auth,async user=>{clean();if(!user)return;try{const s=await getDoc(doc(db,"staff",user.uid));if(!s.exists()||!s.data().storeId)throw 0;storeId=s.data().storeId;el("loginPanel").classList.add("hidden");el("appPanel").classList.remove("hidden");el("staffInfo").textContent=s.data().storeName||storeId;el("storeLabel").textContent=s.data().storeName||storeId;notice("");listenOrders();listenProducts()}catch(x){notice("此帳號尚未開通店家權限。",true)}});
function detail(p,l,v){const x=document.createElement("p");x.className="muted";const b=document.createElement("b");b.textContent=l+"：";x.append(b,document.createTextNode(String(v??"")));p.append(x)}
function action(p,t,h,c=""){const b=document.createElement("button");b.textContent=t;if(c)b.className=c;b.onclick=h;p.append(b)}
function dateText(ts){try{return ts?.toDate?.().toLocaleString("zh-TW")||"—"}catch{return"—"}}
function renderOrder(list,order,active){
 const row=document.createElement("article");row.className="line";const top=document.createElement("div");top.className="row";
 const title=document.createElement("strong");title.textContent=order.orderNo||order.id;const badge=document.createElement("span");badge.className="badge "+(order.status||"");badge.textContent=statusText[order.status]||order.status||"未知";top.append(title,badge);row.append(top);
 detail(row,"日期",dateText(order.createdAt));detail(row,"顧客",order.customerName);detail(row,"電話",order.phone);detail(row,"地址",order.address);detail(row,"時間",order.deliveryTime);detail(row,"付款",order.payment);detail(row,"品項",(order.items||[]).map(i=>`${i.name} × ${i.qty}`).join("、"));detail(row,"合計","$"+order.total);if(order.memo)detail(row,"備註",order.memo);
 if(active){const a=document.createElement("div");a.className="actions";if(order.status==="new"){action(a,"接單",()=>changeStatus(order.id,"accepted"),"success");action(a,"無法接單",()=>changeStatus(order.id,"rejected"),"danger")}else if(order.status==="accepted")action(a,"開始製作",()=>changeStatus(order.id,"preparing"));else if(order.status==="preparing")action(a,"餐點完成",()=>changeStatus(order.id,"ready"),"success");else if(order.status==="ready")action(a,"完成訂單",()=>changeStatus(order.id,"completed"),"success");if(a.children.length)row.append(a)}
 list.append(row)
}
function listenOrders(){stopOrders=onSnapshot(query(collection(db,"orders"),where("storeId","==",storeId)),snap=>{const all=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt?.toMillis?.()||0)-(a.createdAt?.toMillis?.()||0));const active=all.filter(o=>!["completed","rejected"].includes(o.status)),history=all.filter(o=>["completed","rejected"].includes(o.status));el("ordersList").replaceChildren();el("historyList").replaceChildren();if(!active.length)el("ordersList").textContent="目前沒有進行中訂單";else active.forEach(o=>renderOrder(el("ordersList"),o,true));if(!history.length)el("historyList").textContent="目前沒有歷史訂單";else history.slice(0,200).forEach(o=>renderOrder(el("historyList"),o,false))},()=>notice("訂單讀取失敗，請檢查權限。",true))}
async function changeStatus(id,status){try{await updateDoc(doc(db,"orders",id),{status,updatedAt:serverTimestamp()});notice("訂單狀態已更新："+statusText[status])}catch(x){notice("更新訂單失敗。",true)}}
function listenProducts(){stopProducts=onSnapshot(query(collection(db,"products"),where("storeId","==",storeId)),snap=>{const list=el("productsList");list.replaceChildren();const ps=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(a.name).localeCompare(String(b.name),"zh-Hant"));if(!ps.length){list.textContent="尚無商品";return}for(const p of ps){const row=document.createElement("article");row.className="line";const h=document.createElement("strong");h.textContent=`${p.name}　$${p.price}`;row.append(h);detail(row,"狀態",p.active===false?"下架":"上架");if(p.description)detail(row,"說明",p.description);const a=document.createElement("div");a.className="actions";action(a,"編輯",()=>{editingId=p.id;el("productName").value=p.name;el("productPrice").value=p.price;el("productDescription").value=p.description||"";el("formTitle").textContent="編輯商品";el("cancelEdit").classList.remove("hidden")},"quiet");action(a,p.active===false?"上架":"下架",()=>updateDoc(doc(db,"products",p.id),{active:p.active===false,updatedAt:serverTimestamp()}),"quiet");row.append(a);list.append(row)}},()=>notice("商品讀取失敗。",true))}
function resetForm(){editingId=null;el("productForm").reset();el("formTitle").textContent="新增商品";el("cancelEdit").classList.add("hidden")}el("cancelEdit").onclick=resetForm;
el("productForm").onsubmit=async e=>{e.preventDefault();const name=el("productName").value.trim(),price=Number(el("productPrice").value),description=el("productDescription").value.trim();if(!name||!Number.isInteger(price)){notice("請填寫正確資料。",true);return}try{if(editingId)await updateDoc(doc(db,"products",editingId),{name,price,description,updatedAt:serverTimestamp()});else await addDoc(collection(db,"products"),{name,price,description,storeId,active:true,createdAt:serverTimestamp()});resetForm();notice("商品已儲存。")}catch(x){notice("商品儲存失敗。",true)}};
</script></body></html>
