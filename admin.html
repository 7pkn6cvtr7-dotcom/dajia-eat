<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>大甲吃什麼｜店家管理後台</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans TC", sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .header {
      background: #ef7f4d;
      color: white;
      padding: 22px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
    }

    .box {
      background: white;
      margin: 20px;
      padding: 20px;
      border-radius: 18px;
      box-shadow: 0 3px 15px rgba(0,0,0,.08);
    }

    h2 {
      margin-top: 0;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 15px;
      border: 0;
      border-radius: 12px;
      background: #ef7f4d;
      color: white;
      font-size: 18px;
      font-weight: bold;
    }

    #message {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="header">
    大甲吃什麼｜店家管理後台
  </div>

  <div class="box">
    <h2>新增商品</h2>

    <label>商品名稱</label>
    <input id="productName" placeholder="例如：雞肉螺螄粉">

    <label>價格</label>
    <input id="productPrice" type="number" placeholder="例如：160">

    <label>店家 ID</label>
    <input id="storeId" value="shiluo-dajia">

    <button id="addProductBtn">
      ＋ 新增商品
    </button>

    <div id="message"></div>
  </div>
  <script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
  import {
    getFirestore,
    collection,
    addDoc
  } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBGJmQtrcZzLGPa783ZEAAI9FLS",
    authDomain: "dajia-eat.firebaseapp.com",
    projectId: "dajia-eat",
    storageBucket: "dajia-eat.firebasestorage.app",
    messagingSenderId: "213698880065"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const button = document.getElementById("addProductBtn");
  const message = document.getElementById("message");

  button.addEventListener("click", async () => {
    const name = document.getElementById("productName").value.trim();
    const price = Number(document.getElementById("productPrice").value);
    const storeId = document.getElementById("storeId").value.trim();

    if (!name || !price || !storeId) {
      message.textContent = "請把商品資料填完整";
      return;
    }

    try {
      button.disabled = true;
      button.textContent = "新增中...";

      await addDoc(collection(db, "products"), {
        name: name,
        price: price,
        storeId: storeId
      });

      message.textContent = "✅ 商品新增成功";

      document.getElementById("productName").value = "";
      document.getElementById("productPrice").value = "";

    } catch (error) {
      console.error(error);
      message.textContent = "❌ 新增失敗：" + error.message;
    } finally {
      button.disabled = false;
      button.textContent = "＋ 新增商品";
    }
  });
</script>

</body>
</html>
