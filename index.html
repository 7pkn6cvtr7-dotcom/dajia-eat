<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>大甲吃什麼</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif;
      background: #f6f6f6;
      color: #222;
      padding-bottom: 90px;
    }

    header {
      background: #ff6b35;
      color: white;
      padding: 22px 18px 20px;
    }

    header h1 {
      margin: 0 0 5px;
      font-size: 28px;
    }

    header p {
      margin: 0;
      opacity: .9;
    }

    .search {
      padding: 15px;
      background: white;
    }

    .search input {
      width: 100%;
      border: 0;
      background: #f1f1f1;
      padding: 14px;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
    }

    .categories {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 12px 15px;
      background: white;
    }

    .category {
      white-space: nowrap;
      background: #fff1eb;
      color: #e8531f;
      padding: 9px 16px;
      border-radius: 20px;
      font-weight: bold;
    }

    .section {
      padding: 18px 15px;
    }

    .section h2 {
      font-size: 20px;
      margin: 0 0 14px;
    }

    .shop {
      background: white;
      border-radius: 16px;
      margin-bottom: 15px;
      overflow: hidden;
      box-shadow: 0 2px 10px rgba(0,0,0,.06);
    }

    .shop-image {
      height: 150px;
      background: linear-gradient(135deg,#ff8a5c,#ff5d22);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 55px;
    }

    .shop-info {
      padding: 15px;
    }

    .shop-info h3 {
      margin: 0 0 7px;
      font-size: 19px;
    }

    .shop-info p {
      margin: 4px 0;
      color: #777;
      font-size: 14px;
    }

    .menu {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #eee;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .price {
      font-weight: bold;
      color: #e8531f;
    }

    button {
      border: 0;
      background: #ff6b35;
      color: white;
      padding: 9px 14px;
      border-radius: 10px;
      font-weight: bold;
      font-size: 14px;
    }

    .cart {
      position: fixed;
      left: 15px;
      right: 15px;
      bottom: 18px;
      background: #222;
      color: white;
      border-radius: 16px;
      padding: 15px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 5px 20px rgba(0,0,0,.25);
    }

    .cart-total {
      font-weight: bold;
    }

    .cart button {
      background: #ff6b35;
    }
  </style>
</head>

<body>

<header>
  <h1>🍜 大甲吃什麼</h1>
  <p>大甲在地美食・快速外送到你家</p>
</header>

<div class="search">
  <input type="text" placeholder="搜尋店家或餐點 🔍">
</div>

<div class="categories">
  <div class="category">🔥 熱門</div>
  <div class="category">🍜 麵食</div>
  <div class="category">🍱 便當</div>
  <div class="category">🥤 飲料</div>
  <div class="category">🍗 炸物</div>
  <div class="category">🍰 甜點</div>
</div>

<div class="section">

  <h2>大甲熱門店家</h2>

  <div class="shop">

    <div class="shop-image">
      🍜
    </div>

    <div class="shop-info">

      <h3>十螺 螺螄粉 大甲店</h3>

      <p>⭐ 4.9 ・ 約 20–35 分鐘</p>
      <p>📍 大甲區</p>

      <div class="menu">
        <div>
          <b>招牌原味螺螄粉</b><br>
          <span class="price">$150</span>
        </div>

        <button onclick="addCart('招牌原味螺螄粉',150)">
          ＋ 加入
        </button>
      </div>

      <div class="menu">
        <div>
          <b>雞肉螺螄粉</b><br>
          <span class="price">$160</span>
        </div>

        <button onclick="addCart('雞肉螺螄粉',160)">
          ＋ 加入
        </button>
      </div>

    </div>

  </div>

  <div class="shop">

    <div class="shop-image">
      🍱
    </div>

    <div class="shop-info">

      <h3>大甲便當店</h3>

      <p>⭐ 4.7 ・ 約 15–25 分鐘</p>
      <p>📍 大甲區</p>

      <div class="menu">

        <div>
          <b>招牌雞腿飯</b><br>
          <span class="price">$120</span>
        </div>

        <button onclick="addCart('招牌雞腿飯',120)">
          ＋ 加入
        </button>

      </div>

    </div>

  </div>

</div>

<div class="cart">

  <div>
    🛒 <span id="cartCount">0</span> 件
    <span class="cart-total">
      ・ $<span id="cartTotal">0</span>
    </span>
  </div>

  <button onclick="checkout()">
    去結帳
  </button>

</div>

<script>

let count = 0;
let total = 0;
let items = [];

function addCart(name, price) {

  count++;
  total += price;

  items.push({
    name: name,
    price: price
  });

  document.getElementById("cartCount").innerText = count;
  document.getElementById("cartTotal").innerText = total;
}

function checkout() {

  if(count === 0){
    alert("購物車目前是空的");
    return;
  }

  let order = "你的訂單：\n\n";

  items.forEach(function(item){
    order += item.name + " $" + item.price + "\n";
  });

  order += "\n總金額 $" + total;

  alert(order);
}

</script>

</body>
</html>
