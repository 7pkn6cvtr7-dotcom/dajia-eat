<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大甲吃什麼｜店家接單</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f6f6f6;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:#222;
}

header{
  background:#ff7542;
  color:white;
  padding:24px 20px;
}

header h1{
  margin:0;
  font-size:26px;
}

header p{
  margin:8px 0 0;
  opacity:.9;
}

.container{
  max-width:600px;
  margin:auto;
  padding:20px;
}

.status{
  background:#fff3e8;
  color:#e85c2a;
  padding:14px;
  border-radius:14px;
  margin-bottom:18px;
  font-weight:bold;
}

.order{
  background:white;
  border-radius:20px;
  padding:20px;
  box-shadow:0 5px 20px rgba(0,0,0,.06);
}

.order-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.order-number{
  font-size:20px;
  font-weight:bold;
}

.new{
  background:#ff7542;
  color:white;
  padding:6px 12px;
  border-radius:20px;
  font-size:14px;
}

.info{
  margin-top:18px;
  line-height:1.9;
}

.items{
  border-top:1px solid #eee;
  border-bottom:1px solid #eee;
  margin:16px 0;
  padding:14px 0;
}

.total{
  font-size:22px;
  font-weight:bold;
  text-align:right;
}

.buttons{
  display:flex;
  gap:10px;
  margin-top:20px;
}

button{
  flex:1;
  border:0;
  padding:15px;
  border-radius:14px;
  font-size:17px;
  font-weight:bold;
}

.accept{
  background:#ff7542;
  color:white;
}

.reject{
  background:#eee;
  color:#555;
}

.accepted{
  background:#e9f8ec;
  color:#25863a;
  padding:15px;
  border-radius:14px;
  margin-top:20px;
  text-align:center;
  font-weight:bold;
  display:none;
}
</style>
</head>

<body>

<header>
  <h1>🍜 店家接單後台</h1>
  <p>大甲吃什麼・十螺 螺螄粉 大甲店</p>
</header>

<div class="container">

  <div class="status">
    🔔 目前有 1 筆新訂單
  </div>

  <div class="order">

    <div class="order-top">
      <div class="order-number">
        DJ260921-1089
      </div>

      <div class="new">
        新訂單
      </div>
    </div>

    <div class="info">
      👤 王先生<br>
      📱 0912-345-678<br>
      📍 大甲區雁門路191號<br>
      🛵 立即外送
    </div>

    <div class="items">
      <strong>訂單內容</strong><br><br>

      招牌原味螺螄粉 × 1
      <br>
      $150

      <br><br>

      外送費 $40
    </div>

    <div class="total">
      總計 $190
    </div>

    <div class="buttons" id="buttons">

      <button class="reject"
        onclick="rejectOrder()">
        拒絕訂單
      </button>

      <button class="accept"
        onclick="acceptOrder()">
        接受訂單
      </button>

    </div>

    <div class="accepted" id="accepted">
      ✅ 已接受訂單・準備餐點中
    </div>

  </div>

</div>

<script>

function acceptOrder(){

  document.getElementById("buttons").style.display="none";

  document.getElementById("accepted").style.display="block";

}

function rejectOrder(){

  if(confirm("確定要拒絕這筆訂單嗎？")){

    document.querySelector(".order").style.display="none";

    document.querySelector(".status").innerHTML =
    "目前沒有新訂單";

  }

}

</script>

</body>
</html>
