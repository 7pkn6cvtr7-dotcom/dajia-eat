<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>大甲吃什麼｜店家接單</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f6f6f6;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Segoe UI",sans-serif;
  color:#222;
}

header{
  background:#ff7542;
  color:white;
  padding:24px 20px;
}

header h1{
  margin:0;
  font-size:26px;
}

header p{
  margin:8px 0 0;
  opacity:.9;
}

.container{
  max-width:600px;
  margin:auto;
  padding:20px;
}

.status{
  background:#fff3e8;
  color:#e85c2a;
  padding:14px;
  border-radius:14px;
  margin-bottom:18px;
  font-weight:bold;
}

.loading{
  background:white;
  padding:25px;
  border-radius:20px;
  text-align:center;
  color:#777;
}

.empty{
  background:white;
  padding:35px 20px;
  border-radius:20px;
  text-align:center;
  color:#777;
}

.order{
  background:white;
  border-radius:20px;
  padding:20px;
  margin-bottom:18px;
  box-shadow:0 5px 20px rgba(0,0,0,.06);
}

.order-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.order-number{
  font-size:20px;
  font-weight:bold;
  word-break:break-all;
}

.badge{
  padding:6px 12px;
  border-radius:20px;
  font-size:14px;
  font-weight:bold;
  white-space:nowrap;
}

.badge-new{
  background:#ff7542;
  color:white;
}

.badge-accepted{
  background:#e9f8ec;
  color:#25863a;
}

.badge-rejected{
  background:#f2f2f2;
  color:#777;
}

.info{
  margin-top:18px;
  line-height:2;
}

.memo{
  margin-top:12px;
  padding:12px;
  background:#fff7f2;
  border-radius:12px;
  line-height:1.6;
}

.items{
  border-top:1px solid #eee;
  border-bottom:1px solid #eee;
  margin:16px 0;
  padding:14px 0;
}

.item{
  display:flex;
  justify-content:space-between;
  gap:15px;
  padding:7px 0;
}

.item-name{
  font-weight:bold;
}

.item-price{
  color:#777;
  white-space:nowrap;
}

.delivery{
  margin-top:12px;
  color:#666;
}

.total{
  font-size:22px;
  font-weight:bold;
  text-align:right;
}

.buttons{
  display:flex;
  gap:10px;
  margin-top:20px;
}

button{
  flex:1;
  border:0;
  padding:15px;
  border-radius:14px;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
}

.accept{
  background:#ff7542;
  color:white;
}

.reject{
  background:#eee;
  color:#555;
}

.accepted-box{
  background:#e9f8ec;
  color:#25863a;
  padding:15px;
  border-radius:14px;
  margin-top:20px;
  text-align:center;
  font-weight:bold;
}

.error{
  background:#ffeaea;
  color:#b42318;
  padding:15px;
  border-radius:14px;
}
</style>
</head>

<body>

<header>
  <h1>🍜 店家接單後台</h1>
  <p>大甲吃什麼・十螺 螺螄粉 大甲店</p>
</header>

<div class="container">

  <div class="status" id="status">
    🔄 正在讀取新訂單...
  </div>

  <div id="orders">
    <div class="loading">
      訂單讀取中...
    </div>
  </div>

</div>


<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";

import {
  getFirestore,
  collection,
  query,
  where,
  onSnapshot,
  doc,
  updateDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";


/* =========================
   Firebase 設定
========================= */

const firebaseConfig = {

  apiKey:
  "AIzaSyBGJmQtrcZzLGPa783ZEAAI9FL5asa5J8A",

  authDomain:
  "dajia-eat.firebaseapp.com",

  projectId:
  "dajia-eat",

  storageBucket:
  "dajia-eat.firebasestorage.app",

  messagingSenderId:
  "213698880065",

  appId:
  "1:213698880065:web:cb3611a26082e618615cc0"

};


const app =
  initializeApp(firebaseConfig);

const db =
  getFirestore(app);

const STORE_ID =
  "shiluo-dajia";


/* =========================
   防止文字破壞 HTML
========================= */

function escapeHtml(value){

  const div =
    document.createElement("div");

  div.textContent =
    String(value ?? "");

  return div.innerHTML;

}


/* =========================
   金額格式
========================= */

function money(value){

  return Number(value || 0)
    .toLocaleString("zh-TW");

}


/* =========================
   訂單狀態名稱
========================= */

function statusText(status){

  if(status === "accepted"){
    return "已接單";
  }

  if(status === "rejected"){
    return "已拒絕";
  }

  return "新訂單";

}


/* =========================
   顯示訂單
========================= */

function renderOrders(snapshot){

  const ordersBox =
    document.getElementById("orders");

  const statusBox =
    document.getElementById("status");


  const orders = [];

  snapshot.forEach(orderDoc => {

    orders.push({
      id:orderDoc.id,
      ...orderDoc.data()
    });

  });


  /* 新訂單排最前面 */

  orders.sort((a,b)=>{

    const aTime =
      a.createdAt?.seconds || 0;

    const bTime =
      b.createdAt?.seconds || 0;

    return bTime - aTime;

  });


  const newCount =
    orders.filter(
      order => order.status === "new"
    ).length;


  if(newCount > 0){

    statusBox.innerHTML =
      "🔔 目前有 " +
      newCount +
      " 筆新訂單";

  }else{

    statusBox.innerHTML =
      "目前沒有新訂單";

  }


  if(orders.length === 0){

    ordersBox.innerHTML = `
      <div class="empty">
        📭<br><br>
        目前沒有訂單
      </div>
    `;

    return;

  }


  ordersBox.innerHTML = "";


  orders.forEach(order => {

    const orderDiv =
      document.createElement("div");

    orderDiv.className =
      "order";


    /* 商品內容 */

    let itemsHtml = "";

    if(
      Array.isArray(order.items) &&
      order.items.length > 0
    ){

      order.items.forEach(item => {

        const itemTotal =
          Number(item.price || 0) *
          Number(item.qty || 0);

        itemsHtml += `
          <div class="item">

            <div>
              <div class="item-name">
                ${escapeHtml(item.name)}
                × ${Number(item.qty || 0)}
              </div>

              <div class="item-price">
                $${money(item.price)} / 份
              </div>
            </div>

            <div>
              $${money(itemTotal)}
            </div>

          </div>
        `;

      });

    }else{

      itemsHtml =
        "<div>沒有商品資料</div>";

    }


    /* 狀態 */

    let badgeClass =
      "badge-new";

    if(order.status === "accepted"){

      badgeClass =
        "badge-accepted";

    }

    if(order.status === "rejected"){

      badgeClass =
        "badge-rejected";

    }


    /* 按鈕 */

    let actionHtml = "";

    if(order.status === "new"){

      actionHtml = `
        <div class="buttons">

          <button
            class="reject"
            data-action="reject"
            data-id="${order.id}"
          >
            拒絕訂單
          </button>

          <button
            class="accept"
            data-action="accept"
            data-id="${order.id}"
          >
            接受訂單
          </button>

        </div>
      `;

    }else if(order.status === "accepted"){

      actionHtml = `
        <div class="accepted-box">
          ✅ 已接受訂單・準備餐點中
        </div>
      `;

    }else if(order.status === "rejected"){

      actionHtml = `
        <div class="accepted-box"
             style="background:#f2f2f2;color:#777;">
          ❌ 此訂單已拒絕
        </div>
      `;

    }


    let memoHtml = "";

    if(order.memo){

      memoHtml = `
        <div class="memo">
          📝 備註：
          ${escapeHtml(order.memo)}
        </div>
      `;

    }


    orderDiv.innerHTML = `

      <div class="order-top">

        <div class="order-number">
          ${escapeHtml(order.orderNo || order.id)}
        </div>

        <div class="badge ${badgeClass}">
          ${statusText(order.status)}
        </div>

      </div>


      <div class="info">

        👤
        ${escapeHtml(
          order.customerName || ""
        )}
        <br>

        📱
        ${escapeHtml(
          order.phone || ""
        )}
        <br>

        📍
        ${escapeHtml(
          order.address || ""
        )}
        <br>

        🛵
        ${escapeHtml(
          order.deliveryTime || ""
        )}
        <br>

        💵
        ${escapeHtml(
          order.payment || ""
        )}

      </div>


      ${memoHtml}


      <div class="items">

        <strong>
          訂單內容
        </strong>

        <br><br>

        ${itemsHtml}

        <div class="delivery">
          外送費
          $${money(order.deliveryFee)}
        </div>

      </div>


      <div class="total">
        總計
        $${money(order.total)}
      </div>


      ${actionHtml}

    `;


    ordersBox.appendChild(
      orderDiv
    );

  });


  /* 綁定按鈕 */

  document
    .querySelectorAll(
      '[data-action="accept"]'
    )
    .forEach(button => {

      button.addEventListener(
        "click",
        ()=>acceptOrder(
          button.dataset.id,
          button
        )
      );

    });


  document
    .querySelectorAll(
      '[data-action="reject"]'
    )
    .forEach(button => {

      button.addEventListener(
        "click",
        ()=>rejectOrder(
          button.dataset.id,
          button
        )
      );

    });

}


/* =========================
   接受訂單
========================= */

async function acceptOrder(
  orderId,
  button
){

  if(
    !confirm(
      "確定要接受這筆訂單嗎？"
    )
  ){
    return;
  }


  try{

    button.disabled = true;

    button.textContent =
      "處理中...";


    await updateDoc(
      doc(
        db,
        "orders",
        orderId
      ),
      {

        status:"accepted",

        acceptedAt:
          serverTimestamp()

      }
    );


  }catch(error){

    console.error(error);

    alert(
      "接單失敗：" +
      error.message
    );

    button.disabled = false;

    button.textContent =
      "接受訂單";

  }

}


/* =========================
   拒絕訂單
========================= */

async function rejectOrder(
  orderId,
  button
){

  if(
    !confirm(
      "確定要拒絕這筆訂單嗎？"
    )
  ){
    return;
  }


  try{

    button.disabled = true;

    button.textContent =
      "處理中...";


    await updateDoc(
      doc(
        db,
        "orders",
        orderId
      ),
      {

        status:"rejected",

        rejectedAt:
          serverTimestamp()

      }
    );


  }catch(error){

    console.error(error);

    alert(
      "拒絕訂單失敗：" +
      error.message
    );

    button.disabled = false;

    button.textContent =
      "拒絕訂單";

  }

}


/* =========================
   即時監聽十螺訂單
========================= */

const ordersQuery =
  query(

    collection(
      db,
      "orders"
    ),

    where(
      "storeId",
      "==",
      STORE_ID
    )

  );


onSnapshot(

  ordersQuery,

  snapshot => {

    renderOrders(snapshot);

  },

  error => {

    console.error(error);

    document.getElementById(
      "status"
    ).innerHTML =
      "❌ 訂單讀取失敗";

    document.getElementById(
      "orders"
    ).innerHTML = `
      <div class="error">
        無法讀取訂單：<br>
        ${escapeHtml(error.message)}
      </div>
    `;

  }

);

</script>

</body>
</html>
